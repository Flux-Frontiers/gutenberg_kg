# XcodeGen spec for the iPhone app.
#   brew install xcodegen && cd app/ios && xcodegen generate && open KnowledgePress.xcodeproj
# See README.md for the by-hand alternative.
name: KnowledgePress
options:
  bundleIdPrefix: com.fluxfrontiers
  # 26.0, not the 18.0 this claimed until 2026-09-15. That was fiction:
  # OnDeviceSynthesis is @available(iOS 26.0) and PrivateCloudSynthesis is 27,
  # so on iOS 18 the app installs, opens, and has no answer engine at all.
  # 26 is also what Apple-Hosted Background Assets needs, should the corpus
  # ever move out of the bundle -- so the floor costs nothing and buys that.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  GutenbergKGKit:
    path: ../GutenbergKGKit

targets:
  KnowledgePress:
    type: application
    platform: iOS
    sources:
      - Sources
      # Generated by scripts/make_app_icon.py from the brand system in
      # assets/brand-system/. Committed rather than built, because the glyph
      # depends on which serif is installed and CI has different fonts.
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      # A folder reference, so the corpus keeps its layout inside the bundle
      # and CorpusPacks can open it as a directory. Empty in development and
      # in CI; `make ios-stage-corpus` fills it before an archive.
      - path: Corpus
        type: folder
    dependencies:
      - package: GutenbergKGKit
        product: KnowledgePressUI
    # Private Cloud Compute needs this entitlement in BOTH the code signature
    # and the provisioning profile. An unsigned `swift run` binary gets
    # ModelManagerError 1046 ("PCC inference is not available in this
    # context") the instant it tries — verified live 2026-09-02. The
    # provisioning half means the App ID must have the capability granted in
    # the developer portal first; until it is, Xcode's automatic signing will
    # refuse to build with this entitlement present.
    # ENABLED 2026-09-14: the entitlement request was granted and the
    # capability is now checked on the App ID. Enabling a capability
    # invalidates existing profiles, so a stale one on disk gives the same
    # "entitlement not in profile" failure as never having enabled it --
    # delete it and let automatic signing fetch a fresh one.
    entitlements:
      path: KnowledgePress.entitlements
      properties:
        com.apple.developer.private-cloud-compute: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Knowledge Press
        # Both from the build settings below, so the Makefile can set the build
        # number (git commit count) at build time.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Without this, every single upload stops to ask the export-compliance
        # question by hand. False is correct here: the app uses no encryption
        # beyond HTTPS, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The worker is a Mac on the same network, over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription:
          The Knowledge Press connects to the GutenbergKG worker running on your
          Mac to retrieve passages. Answers are written on this device.
    # Without a shared scheme, xcodebuild invents one that builds every target
    # in the workspace -- including the package's `KnowledgePress` executable,
    # the macOS shell, which imports AppKit and cannot compile for iOS. This
    # pins the scheme to the app target and its actual dependency chain.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluxfrontiers.knowledgepress
        # Tracks the gutenberg-kg package version (pyproject.toml);
        # tests/test_app_version.py fails when they differ.
        MARKETING_VERSION: "1.22.2"
        # Overridden by the Makefile with `git rev-list --count HEAD`.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
