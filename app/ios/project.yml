# XcodeGen spec for the iPhone app.
#   brew install xcodegen && cd app/ios && xcodegen generate && open KnowledgePress.xcodeproj
# See README.md for the by-hand alternative.
name: KnowledgePress
options:
  bundleIdPrefix: com.fluxfrontiers
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GutenbergKGKit:
    path: ../GutenbergKGKit

targets:
  KnowledgePress:
    type: application
    platform: iOS
    sources:
      - Sources
      # Generated by scripts/make_app_icon.py from the brand system in
      # assets/brand-system/. Committed rather than built, because the glyph
      # depends on which serif is installed and CI has different fonts.
      - Assets.xcassets
    dependencies:
      - package: GutenbergKGKit
        product: KnowledgePressUI
    # Private Cloud Compute needs this entitlement in BOTH the code signature
    # and the provisioning profile. An unsigned `swift run` binary gets
    # ModelManagerError 1046 ("PCC inference is not available in this
    # context") the instant it tries — verified live 2026-09-02. The
    # provisioning half means the App ID must have the capability granted in
    # the developer portal first; until it is, Xcode's automatic signing will
    # refuse to build with this entitlement present.
    # DISABLED until the capability is granted on the App ID. Leaving it in
    # blocks every device build, not just PCC: the profile automatic signing
    # generates cannot carry an entitlement the App ID does not hold, so the
    # build fails before it starts. Uncomment all four lines once the portal
    # shows the capability; nothing else has to change.
    # entitlements:
    #   path: KnowledgePress.entitlements
    #   properties:
    #     com.apple.developer.private-cloud-compute: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Knowledge Press
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The worker is a Mac on the same network, over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription:
          The Knowledge Press connects to the GutenbergKG worker running on your
          Mac to retrieve passages. Answers are written on this device.
    # Without a shared scheme, xcodebuild invents one that builds every target
    # in the workspace -- including the package's `KnowledgePress` executable,
    # the macOS shell, which imports AppKit and cannot compile for iOS. This
    # pins the scheme to the app target and its actual dependency chain.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluxfrontiers.knowledgepress
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
