# Build the docs/*.md guides and the mkdocstrings API reference into a
# GitHub Pages site.
#
# Runs on every push to main so the site never drifts from the guides, and
# on demand.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/gutenberg_kg/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let in-progress production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: docs-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # mkdocstrings imports gutenberg_kg to read its docstrings, so the env
      # must satisfy every documented module's top-level import: chat
      # (streamlit/httpx), image (fastapi/uvicorn), mcp (fastmcp/structlog),
      # viz+viz3d (plotly/PyQt5/pyvista/pycode-kg), kgdeps (kg-rag). None of
      # the documented modules import gutenberg_kg.serve.handler or runpod,
      # so unlike the old pdoc build this needs no separate runpod install.
      - name: Install dependencies
        run: poetry install --no-interaction --with docs --extras "chat image mcp viz viz3d kgdeps"

      # Not --strict: docs/*.md cross-links to src/, benchmarks/, scripts/,
      # docker/ and the top-level README (outside docs_dir) render fine on
      # GitHub but have no target inside the built site, and mkdocstrings'
      # griffe backend warns on GutenbergForestVisualizer's (viz3d.py)
      # param.Parameterized docstring not matching its dynamically-generated
      # __init__ signature -- same class of pre-existing, non-broken state as
      # quiltwright's NamedTuple case, just a different declarative framework.
      - name: Build
        run: poetry run mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
