name: Docs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let in-progress production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API docs (pdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: docs-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # pdoc IMPORTS every documented module, so the env must satisfy every
      # top-level import: chat (streamlit/httpx), image (fastapi/uvicorn),
      # mcp (fastmcp/structlog), viz+viz3d (plotly/PyQt5/pyvista/pycode-kg),
      # dev (pdoc itself), kgdeps (kg-rag — serve.handler runs its registry
      # bootstrap at import time, so even its function-local imports count). runpod (serve.handler's import) is deliberately in
      # no extra — its dep tree stalls poetry lock — so it installs via plain
      # pip, same rationale as runpod/requirements.txt.
      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev --extras "chat image mcp viz viz3d kgdeps"
          poetry run pip install --quiet runpod

      # PDOC_ALLOW_EXEC: pdoc sandboxes subprocesses during import;
      # runpod's import calls cpuinfo, which shells out on Linux and
      # crashes on the suppressed (empty) output.
      - name: Build docs
        run: poetry run make docs
        env:
          PDOC_ALLOW_EXEC: "1"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
