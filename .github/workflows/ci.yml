name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dev dependencies
        run: poetry install --no-interaction --extras dev

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: typecheck-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --extras dev

      - name: Run ty
        run: poetry run ty check src/

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --extras dev

      - name: Run tests
        run: poetry run pytest

  wheel:
    name: Installed CLI
    runs-on: ubuntu-latest
    # Guards the one thing the other jobs structurally cannot see. lint,
    # type-check and test all run against the source tree with
    # pythonpath = ["src"], so they pass even when the built wheel is missing
    # modules the CLI imports, or when a dependency is declared in a form PyPI
    # strips from wheel metadata. ia-kg 0.1.0 shipped exactly that way: green
    # CI, and every console script dead on `pip install`.
    #
    # This builds the artifact users actually receive, installs it somewhere
    # with no source tree in sight, and loads every console-script entry point.
    # entry_point.load() imports the module and resolves the attribute without
    # calling it -- so an MCP server entry point is verified, not started.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build wheel
        run: poetry build

      - name: Install the wheel into a clean venv
        # [mcp] only. Unlike the rest of the fleet, this package's serving entry
        # points are provisioned outside its dependency metadata entirely: the
        # Makefile builds .venv-image / .venv-sdxl with `pip install --no-deps`
        # plus docker/requirements-*.txt, and the RunPod worker installs
        # runpod/requirements.txt. pyproject documents why runpod is deliberately
        # not an extra — its fastapi[all]/boto3/aiohttp tree makes `poetry lock`
        # pathologically slow. So those three are skipped below rather than
        # forced into the main dependency graph to satisfy this check.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$(ls dist/*.whl)[mcp]"

      - name: Load every console-script entry point
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import sys

          # Provisioned from docker/requirements-*.txt and runpod/requirements.txt
          # in isolated venvs, never from this package's metadata. See the
          # install step above.
          SKIP = {"gutenkg-handler", "gutenkg-image-server", "gutenkg-sdxl-server"}

          eps = [e for e in md.distribution("gutenberg-kg").entry_points
                 if e.group == "console_scripts" and e.name not in SKIP]
          if not eps:
              sys.exit("no console scripts found in the installed distribution")

          failed = []
          for e in sorted(eps, key=lambda e: e.name):
              try:
                  e.load()
                  print(f"  ok    {e.name} -> {e.value}")
              except Exception as exc:
                  failed.append(e.name)
                  print(f"  FAIL  {e.name} -> {e.value}\n        {type(exc).__name__}: {exc}")
          if failed:
              sys.exit(f"\n{len(failed)} console script(s) unusable when installed: "
                       + ", ".join(failed))
          print(f"\nall {len(eps)} console scripts load from a clean install")
          PY
