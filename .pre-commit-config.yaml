repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
        exclude: '^corpus/.*\.(md|txt)|^(corpus|docs)/.*\.(png|jpg|jpeg|gif|pdf)$|^\.pycodekg/'
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: '^\.claude/'
        pass_filenames: false
        always_run: true
      - id: ruff-format
        exclude: '^\.claude/'
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline',
               '--exclude-files', 'corpus/.*',
               '--exclude-files', '\.pycodekg/.*']

  - repo: local
    hooks:
      # `--exclude viz3d.py` is not a coverage hole relative to CI, though it
      # looks like one at a glance. viz3d.py currently carries ~33 real
      # diagnostics against the installed PyQt5 stubs (Qt.Checked resolution,
      # a closeEvent override mismatch) — pre-existing, accepted debt, not
      # something a commit touching an unrelated file should be blocked on.
      # CI's type-check job (.github/workflows/ci.yml) never sees any of this
      # either way: it installs `--extras pov`, not `viz3d`, so PyQt5 is
      # absent there and `[tool.ty.rules] unresolved-import = "ignore"`
      # (pyproject.toml) swallows the Qt-touching code as untyped rather than
      # flagging it. This exclusion only matters on a machine that installed
      # `viz3d` too (docs/INSTALLATION.md's recommended dev setup does), where
      # PyQt5's real stubs are present and would otherwise surface these.
      #
      # `files:` without `always_run:` is what scopes these three. They keep
      # `pass_filenames: false`, so each still runs over its whole target --
      # the point is only to decide *whether* to run, not what to run. Before
      # this, a Makefile or app/ edit ran the full 787-test suite and an
      # mkdocs build for nothing.
      - id: ty
        name: ty
        entry: .venv/bin/ty check src/ --exclude src/gutenberg_kg/viz3d.py --python .venv
        language: system
        pass_filenames: false
        files: '^src/.*\.py$|^pyproject\.toml$'
      # poetry.lock and pyproject.toml are in here deliberately: a dependency
      # bump breaks tests without touching a line of src/ or tests/.
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest --tb=short -q
        language: system
        pass_filenames: false
        files: '^(src|tests)/.*\.py$|^pyproject\.toml$|^poetry\.lock$'
      # Plain `mkdocs build` (what docs.yml's CI job runs) exits 0 on a
      # broken internal link or missing nav target -- those are warnings,
      # not errors. This runs --strict instead and only fails on a warning
      # outside the two permanently-accepted categories documented in
      # docs.yml's own comment. See scripts/check_docs_build.py. Skips
      # cleanly rather than failing when the optional `docs` Poetry group
      # is not installed, since most contributors only have `dev`.
      #
      # `^src/` belongs in this pattern even though it looks like Python-only
      # territory: the api/*.md pages are mkdocstrings directives, so the site
      # is rendered *from* the docstrings in src/ and a docstring edit really
      # can break the build. Note app/RUNBOOK.md and the other app/ docs are
      # deliberately absent -- they are not in docs_dir and mkdocs never sees
      # them.
      - id: mkdocs-build
        name: mkdocs build
        entry: python3 scripts/check_docs_build.py
        language: system
        pass_filenames: false
        files: '^docs/|^mkdocs\.yml$|^src/.*\.py$|^scripts/check_docs_build\.py$'
