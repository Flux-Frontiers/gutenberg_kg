repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
        exclude: '^corpus/.*\.(md|txt)|^(corpus|docs)/.*\.(png|jpg|jpeg|gif|pdf)$|^\.pycodekg/'
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: '^\.claude/'
        pass_filenames: false
        always_run: true
      - id: ruff-format
        exclude: '^\.claude/'
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline',
               '--exclude-files', 'corpus/.*',
               '--exclude-files', '\.pycodekg/.*']

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: .venv/bin/ty check src/ --exclude src/gutenberg_kg/viz3d.py --python .venv
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
      # Plain `mkdocs build` (what docs.yml's CI job runs) exits 0 on a
      # broken internal link or missing nav target -- those are warnings,
      # not errors. This runs --strict instead and only fails on a warning
      # outside the two permanently-accepted categories documented in
      # docs.yml's own comment. See scripts/check_docs_build.py. Skips
      # cleanly rather than failing when the optional `docs` Poetry group
      # is not installed, since most contributors only have `dev`.
      - id: mkdocs-build
        name: mkdocs build
        entry: python3 scripts/check_docs_build.py
        language: system
        pass_filenames: false
        always_run: true
