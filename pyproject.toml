# pyproject.toml — gutenberg-kg package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
# Note         : Build/run automation tasks live in Makefile (not Poe tasks)
#
# Extras (user-facing features)
# -----------------------------
#   kgdeps   KG integrations — kg-rag, pycode-kg (doc-kg/diary-kg are core deps)
#   viz      2-D growth timeline (plotly)
#   viz3d    3-D visualiser + light-field quilts (pyvistaqt, PyQt5, quiltwright)
#   pov      analytic POV-Ray output, `gutenkg pov` (quiltwright povgen).
#            Headless and NumPy-only — no PyVista, no Qt, no GL context — so a
#            ray-tracing box can install this WITHOUT viz3d.
#   mcp      MCP server, `gutenkg-mcp` (fastmcp, structlog)
#   chat     reading-room UI, `gutenkg chat` (streamlit, httpx, watchdog)
#   image    local image server, `gutenkg-image-server` (fastapi, uvicorn)
#
# Quick install (poetry)
# ----------------------
#   poetry install --extras "kgdeps viz viz3d mcp"   RECOMMENDED user install
#   poetry install --all-extras         every extra above (still no dev tooling)
#   poetry install --extras "viz3d"     one extra at a time, for a leaner install
#   poetry install --extras "pov"       headless POV-Ray box: no GL stack pulled
#   poetry install                      core runtime only
#   poetry install --with dev           core + dev tools (pytest, ruff, ty, etc.)
#
# Quick install (pip)
# -------------------
#   pip install -e ".[kgdeps,viz,viz3d,mcp]"   RECOMMENDED user install
#   pip install -e ".[viz3d]"           one extra at a time
#   pip install -e "."                  core runtime only
#
# Dev tooling lives in the optional Poetry `dev` group, NOT an extra, so it
# stays out of published wheel metadata — there is no `.[dev]` to pip-install.
# Use poetry for development. (Fleet convention: extras are user-facing
# features, groups are repo tooling. See kgrag_priv/docs/FLEET_STANDARDS.md.)
#
# First-time setup (contributors)
# -------------------------------
#   poetry install --with dev --extras "kgdeps viz viz3d pov mcp image"
#   pre-commit install
#
# `pov` and `image` are in there for the tests, not for the features:
# tests/test_povscene.py and tests/test_sdxl_server.py import quiltwright and
# fastapi through the modules under test. Both now `importorskip`, so a
# narrower install SKIPS them rather than failing at collection and taking the
# whole run down — but they only actually run with the extras present, which is
# how CI's test job installs.
#
# Run tests
# ---------
#   pytest                             uses [tool.pytest.ini_options] below
#   pytest -m "not integration"        unit only — skips the serving surfaces
#   pytest --cov=gutenberg_kg          with coverage
#
# Generate docs
# -------------
#   poetry install --with docs --extras "chat image mcp viz viz3d kgdeps"
#   make docs                          build the mkdocs site into ./site
#   make docs-serve                    serve it locally with live reload
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "gutenberg_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "gutenberg-kg"
version = "1.20.0"
description = "The Knowledge Press — universal ingestion engine for digitized text corpora"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "gutenberg", "internet-archive", "dockg", "kgrag", "nlp", "knowledge-press"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Keep this floor equal to the highest one declared in the extras below:
    # scripts/check_pins.py only compares the highest, so a stale low floor here
    # is drift the gate cannot see.
    "kgmodule-utils[synthesis,sqlite-vec]>=0.19.0",
    "rich>=14.3.3,<15",
    "doc-kg (>=0.24.1)",  # transformers 5.x -- must match kg-rag, see kgdeps
    "diary-kg (>=0.98.0)",
    "hf-transfer (>=0.1.9,<0.2.0)",
]

[project.optional-dependencies]
kgdeps = [
    # These floors move together: kg-rag needs transformers>=5.5.0, which older
    # doc-kg/pycode-kg pins (transformers<4.57) contradict.
    "kg-rag>=0.15.0",
    "pycode-kg>=0.25.1",
]
viz = [
    "plotly>=5.0.0",
]
viz3d = [
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    # pyvistaqt only -- pyvista itself arrives via kgmodule-utils[viz3d-render].
    # Not pyvista[jupyter]: viz3d renders to a desktop Qt window (viz3d.py), and
    # [jupyter] only adds the trame/ipywidgets stack, which bloats `poetry lock`.
    "pyvistaqt>=0.11.0",
    # Shared 3-D geometry (Layout3D, fibonacci_*), the organic tree engine
    # (grow_tree, tree_mesh, leaf_glyphs) and, via [viz3d-qt], the POV-Ray worker
    # thread and cast path that scene.py and viz3d.py import.
    "kgmodule-utils[viz3d-render,viz3d-qt]>=0.19.0",
    # Light-field output (`gutenkg quilt`). Same floor as `pov` below on purpose:
    # two different floors make Poetry lock the package twice under overlapping
    # extra markers, and `--extras viz3d` then installs both.
    "quiltwright>=0.7.0",
]
pov = [
    # Analytic POV-Ray output (`gutenkg pov`), deliberately apart from viz3d:
    # NumPy-only geometry ([viz3d], not [viz3d-render]) plus quiltwright's povgen,
    # so a headless ray-tracing box can install this without PyVista, Qt or GL.
    "kgmodule-utils[viz3d]>=0.19.0",
    "quiltwright>=0.7.0",
]
mcp = [
    # Upper-bounded: mcp_server.py builds its FastMCP instance and registers its
    # tools at import, so an incompatible major breaks `gutenkg-mcp` at import
    # time. Lift the ceiling only after verifying 4.x against test_mcp_server.py.
    "fastmcp>=3.0,<4",
    "structlog>=24.0",
]
# Serving layer (gutenberg_kg.serve) -- one extra per module. runpod is
# deliberately absent: its fastapi[all]/boto3/aiohttp tree makes `poetry lock`
# pathologically slow, and the worker only runs in the RunPod container, which
# installs it from runpod/requirements.txt.
chat = [
    "streamlit>=1.59,<2",
    "httpx>=0.27.0",
    "watchdog>=6.0.0",
    "pillow>=10.4.0",
]
# mflux is deliberately absent -- its transformers pin conflicts with pycode-kg,
# so local FLUX generation uses the isolated .venv-image built from
# docker/requirements-image.txt (see `make image-server`).
image = [
    "fastapi>=0.116.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pillow>=10.4.0",
]
# No `full` / `all` aggregate extras: re-listing a package in an aggregate is a
# second declaration under different markers, which poetry resolves by adding an
# override and restarting. Twelve packages did that here -- 1,278 restarts, 503s
# to lock, against 11s without. `full = ["gutenberg-kg[...]"]` is rejected
# outright. Use `--all-extras`, or name the extras you want.

# Dev tooling. A group rather than an extra so pytest/ruff/ty/pre-commit stay
# out of the published wheel metadata — `pip install gutenberg-kg[dev]` was
# never meant to be a thing consumers do. Optional to preserve the contract
# that a bare `poetry install` is core runtime only. Same shape as pycode_kg;
# fleet convention is recorded in kgrag_priv/docs/FLEET_STANDARDS.md.
#
#   poetry install --with dev
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.docs]
optional = true

# The GitHub Pages site (docs.yml): mkdocs-material renders docs/*.md as-is,
# and mkdocstrings adds an API reference generated from the package's own
# docstrings so it can't drift from the code. Same versions quiltwright pins.
[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pillow = ">=10.4.0"
pre-commit = ">=4.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"
scipy = ">=1.13.0"
ty = ">=0.0.41"
vtracer = ">=0.6.0"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/gutenberg_kg"
Repository = "https://github.com/Flux-Frontiers/gutenberg_kg"

[project.scripts]
gutenkg              = "gutenberg_kg.cli.main:cli"
gutenkg-mcp          = "gutenberg_kg.mcp_server:main"
gutenkg-handler      = "gutenberg_kg.serve.handler:main"
gutenkg-image-server = "gutenberg_kg.serve.image_server:main"
gutenkg-sdxl-server  = "gutenberg_kg.serve.sdxl_server:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour
# (0.15 gates it behind preview), so `ruff format --check .` starts rewriting
# prose docs the moment the lock resolves 0.16 — a failure that looks unrelated
# to whatever change triggered the relock. Doc snippets are illustrative and
# often deliberately aligned, so keep them out of the formatter's reach.
# doc_kg and ftree_kg carry the same exclusion.
exclude        = [".claude", "*.md"]

[tool.ruff.lint]
# BLE = flake8-blind-except (replaces pylint broad-exception-caught);
# B023 = bugbear function-uses-loop-variable (replaces pylint cell-var-from-loop).
# pyflakes F821 already covers pylint undefined-variable.
select = ["E", "F", "W", "I", "UP", "BLE", "B023"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
unresolved-import = "ignore"
# The `# ty: ignore[...]` comments on pyvista calls in scene.py and
# cli/cmd_quilt.py look unused to every CI job, because pyvista lives in the
# `viz3d` extra and all three jobs install only `dev`. Without it ty cannot
# resolve `plotter`, so it never emits the `missing-argument` /
# `invalid-argument-type` those comments suppress — but a developer running
# `--all-extras` does have pyvista, and there the suppressions do work. Deleting
# them to satisfy CI would therefore break the check locally.
#
# Silencing the rule keeps both happy. It also defuses a version trap: ty 0.0.44
# (what poetry.lock pins) reports these as warnings and exits 0, while 0.0.70
# exits 1 on the same five. The floor is `ty>=0.0.41` with no ceiling, so the
# next relock would have turned CI red on findings unrelated to whatever
# triggered it.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
# Registered so `-m "not integration"` actually selects, and so a typo in a
# marker name is an error rather than a silently-empty run. These modules also
# `importorskip` their dependency, so they skip on a narrow install even when
# the marker is not used — the mark is for choosing, the guard is for surviving.
markers = [
    "integration: exercises a service or optional-extra surface rather than a pure unit",
]

# ---------------------------------------------------------------------------
# PycodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src", "docker", "runpod"]

[tool.dockg]
# `site` for the same reason as `dist`: `make docs` renders mkdocs into a
# gitignored site/, so the corpus would otherwise differ between machines
# depending on who last built the docs. mkdocs renders .md to .html but copies
# anything it does not render straight through, so the first .txt or .pdf added
# under docs/ would be indexed twice -- once at docs/x.pdf, once at site/x.pdf.
# A duplicate document is worse than a missing one: it double-counts in every
# ranking and returns the same passage twice.
exclude = [
    "corpus", "bundles", "dist", "site", "src", "venv", "reports", "runpod", "docker",
]
