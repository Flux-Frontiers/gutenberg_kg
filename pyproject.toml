# pyproject.toml — gutenberg-kg package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
# Last Revision: 2026-06-07
#
# Build system : Poetry 2.x with PEP 621 [project] table
# Note         : Build/run automation tasks live in Makefile (not Poe tasks)
#
# Quick install (pip)
# -------------------
#   pip install -e ".[dev]"             core + dev tools (pytest, ruff, ty, etc.)
#   pip install -e ".[kgdeps]"          core + KG integrations (doc-kg, kg-rag)
#   pip install -e ".[viz]"             core + 2-D timeline visualisation (plotly)
#   pip install -e ".[viz3d]"           core + 3-D visualisation (pyvista, PyQt5, pycode-kg)
#   pip install -e ".[mcp]"             optional MCP server support (gutenkg-mcp)
#   pip install -e ".[full]"            everything except dev tools (RECOMMENDED)
#   pip install -e ".[all]"             dev + kgdeps + viz + viz3d (everything)
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras         all optional dependency groups
#   poetry install --extras "dev"       core + dev tools only
#   poetry install --extras "kgdeps"    core + KG integrations only
#   poetry install --extras "viz"       core + 2-D timeline visualisation only
#   poetry install --extras "viz3d"     core + 3-D visualisation only
#   poetry install --extras "mcp"       core + MCP server only
#   poetry install --extras "full"      everything except dev tools (RECOMMENDED)
#   poetry install                      core runtime only
#
# First-time setup
# ----------------
#   python -m venv .venv
#   source .venv/bin/activate       # Windows: .venv\Scripts\activate
#   pip install -e ".[dev]"
#
# Run tests
# ---------
#   pytest                          uses [tool.pytest.ini_options] below
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=gutenberg_kg       with coverage
#
# Generate docs
# -------------
#   make docs
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "gutenberg_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "gutenberg-kg"
version = "1.8.0"
description = "The Knowledge Press — universal ingestion engine for digitized text corpora"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "gutenberg", "internet-archive", "dockg", "kgrag", "nlp", "knowledge-press"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "kgmodule-utils[synthesis]>=0.4.6",
    "rich>=13.0.0",
    "doc-kg (>=0.16.0)",
    "diary-kg (>=0.93.2)",
    "hf-transfer (>=0.1.9,<0.2.0)",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "ty>=0.0.41",
    "pdoc>=14.0.0",
    "pillow>=10.0.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "scipy>=1.13.0",
    "vtracer>=0.6.0",
]
kgdeps = [
    "kg-rag>=0.9.1",
    "pycode-kg>=0.19.3",
]
viz = [
    "plotly>=5.0.0",
]
viz3d = [
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    # NOTE: plain pyvista, NOT pyvista[jupyter]. viz3d renders to a desktop Qt
    # window via pyvistaqt's QtInteractor (see pycode_kg/viz3d.py) — the [jupyter]
    # extra only pulls the trame/ipywidgets/jupyter-server browser-rendering stack,
    # which nothing here imports and which massively bloated `poetry lock`. Re-add
    # [jupyter] (→ trame) only if we ever render 3-D into a notebook or browser.
    "pyvista>=0.44.0",
    "pyvistaqt>=0.11.0",
    "pycode-kg>=0.19.3",
]
mcp = [
    "fastmcp>=2.0",
    "structlog>=24.0",
]
# Serving layer (gutenberg_kg.serve) — one extra per module.
# NOTE: runpod is deliberately NOT listed (no `worker` extra) — its
# fastapi[all]/boto3/aiohttp[speedups] tree makes `poetry lock` pathologically
# slow, and the worker only runs in the RunPod container, which installs it
# via runpod/requirements.txt (same rationale as the mflux exclusion below).
chat = [
    "streamlit>=1.59,<2",
    "httpx>=0.27.0",
    "watchdog>=6.0.0",
    "pillow>=10.4.0",
]
# NOTE: mflux is deliberately NOT listed — its transformers pin conflicts with
# pycode-kg, so local FLUX generation uses the isolated .venv-image built from
# docker/requirements-image.txt (see `make image-server`).
image = [
    "fastapi>=0.116.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pillow>=10.4.0",
]
# Everything except dev tooling — the recommended default install.
full = [
    # kgdeps
    "kg-rag>=0.9.1",
    # viz
    "plotly>=5.0.0",
    # viz3d
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    "pyvista>=0.44.0",  # NOT [jupyter] — see viz3d extra note above
    "pyvistaqt>=0.11.0",
    "pycode-kg>=0.19.3",
    # mcp
    "fastmcp>=2.0",
    "structlog>=24.0",
]
all = [
    # dev
    "detect-secrets>=1.5.0",
    "ty>=0.0.41",
    "pdoc>=14.0.0",
    "pillow>=10.0.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "scipy>=1.13.0",
    "vtracer>=0.6.0",
    # kgdeps
    "kg-rag>=0.9.1",
    # viz
    "plotly>=5.0.0",
    # viz3d
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    "pyvista>=0.44.0",  # NOT [jupyter] — see viz3d extra note above
    "pyvistaqt>=0.11.0",
    "pycode-kg>=0.19.3",
]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/gutenberg_kg"
Repository = "https://github.com/Flux-Frontiers/gutenberg_kg"

[project.scripts]
gutenkg              = "gutenberg_kg.cli.main:cli"
gutenkg-mcp          = "gutenberg_kg.mcp_server:main"
gutenkg-handler      = "gutenberg_kg.serve.handler:main"
gutenkg-image-server = "gutenberg_kg.serve.image_server:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
exclude        = [".claude"]

[tool.ruff.lint]
# BLE = flake8-blind-except (replaces pylint broad-exception-caught);
# B023 = bugbear function-uses-loop-variable (replaces pylint cell-var-from-loop).
# pyflakes F821 already covers pylint undefined-variable.
select = ["E", "F", "W", "I", "UP", "BLE", "B023"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# PycodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src", "docker", "runpod"]

[tool.dockg]
exclude = [
    "corpus", "bundles", "dist", "src", "venv", "reports", "runpod", "docker",
]
