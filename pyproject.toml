# pyproject.toml — gutenberg-kg package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
# Note         : Build/run automation tasks live in Makefile (not Poe tasks)
#
# Quick install (pip)
# -------------------
#   pip install -e ".[kgdeps]"          core + KG integrations (doc-kg, kg-rag)
#   pip install -e ".[viz]"             core + 2-D timeline visualisation (plotly)
#   pip install -e ".[viz3d]"           core + 3-D visualisation + quilts (pyvista, PyQt5, quiltwright)
#   pip install -e ".[mcp]"             optional MCP server support (gutenkg-mcp)
#   pip install -e ".[kgdeps,viz,viz3d,mcp]"   everything except dev tools (RECOMMENDED)
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras         all optional extras (not dev tooling)
#   poetry install --with dev           core + dev tools (pytest, ruff, ty, etc.)
#   poetry install --extras "kgdeps"    core + KG integrations only
#   poetry install --extras "viz"       core + 2-D timeline visualisation only
#   poetry install --extras "viz3d"     core + 3-D visualisation only
#   poetry install --extras "mcp"       core + MCP server only
#   poetry install --extras "kgdeps viz viz3d mcp"   everything but dev (RECOMMENDED)
#   poetry install                      core runtime only
#
# Dev tooling lives in the Poetry `dev` group, not an extra, so it stays out
# of published wheel metadata. pip-only setups can't install it — use poetry
# for development. (Fleet convention: extras are user-facing features, groups
# are repo tooling. See kgrag_priv/docs/FLEET_STANDARDS.md.)
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Run tests
# ---------
#   pytest                          uses [tool.pytest.ini_options] below
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=gutenberg_kg       with coverage
#
# Generate docs
# -------------
#   make docs
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "gutenberg_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "gutenberg-kg"
version = "1.14.0"
description = "The Knowledge Press — universal ingestion engine for digitized text corpora"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "gutenberg", "internet-archive", "dockg", "kgrag", "nlp", "knowledge-press"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "kgmodule-utils[synthesis,sqlite-vec]>=0.13.2",
    "rich>=14.3.3,<15",
    "doc-kg (>=0.21.2)",  # transformers 5.x — must match kg-rag; see the kgdeps extra
    "diary-kg (>=0.96.0)",
    "hf-transfer (>=0.1.9,<0.2.0)",
]

[project.optional-dependencies]
kgdeps = [
    # Floors track the current releases — kg-rag 0.11.0 needs transformers>=5.5.0,
    # which older doc-kg/pycode-kg pins (transformers<4.57) contradict.
    "kg-rag>=0.12.0",
    "pycode-kg>=0.23.1",
]
viz = [
    "plotly>=5.0.0",
]
viz3d = [
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    # pyvistaqt only. pyvista itself now arrives via kgmodule-utils[viz3d-render]
    # below, which is where it belongs: the SDK's tree_mesh/leaf_glyphs/smooth_paths
    # need it, so the SDK declares it rather than every consumer hand-pinning it.
    # Still NOT pyvista[jupyter] — viz3d renders to a desktop Qt window via
    # pyvistaqt's QtInteractor (see gutenberg_kg/viz3d.py), and [jupyter] only adds
    # the trame/ipywidgets/jupyter-server browser stack, which nothing here imports
    # and which massively bloated `poetry lock`.
    "pyvistaqt>=0.11.0",
    # Shared 3-D geometry: layout primitives (Layout3D, LayoutNode/Edge,
    # fibonacci_*) and, since 0.12.0, the organic tree engine (grow_tree,
    # tree_mesh, leaf_glyphs) that used to be this package's layout_organic.py.
    # The layouts lived in pycode_kg.layout3d until 0.11.0 took them over, which
    # dropped the odd dependency on the *code* KG package for what is pure
    # geometry; the trees moved for the same reason, so a diary corpus can grow
    # them without depending on a *book* corpus. pycode-kg stays in `kgdeps`
    # for its own CLI.
    "kgmodule-utils[viz3d-render]>=0.13.2",
    # Light-field output (`gutenkg quilt`). 0.4.0 supplies depth_report() and
    # widened requires-python to <3.14, which retires the old marker gate.
    "quiltwright>=0.4.0",
]
mcp = [
    # Upper-bounded: fastmcp ships majors on its own schedule (2.x → 3.x), and
    # src/gutenberg_kg/mcp_server.py builds its FastMCP instance and registers
    # both tools at module import, so an incompatible major breaks `gutenkg-mcp`
    # at import time. The floor is >=3.0 because that is what the lock already
    # resolves to and what the server is verified against; see
    # tests/test_mcp_server.py. Lift the ceiling only after verifying 4.x.
    "fastmcp>=3.0,<4",
    "structlog>=24.0",
]
# Serving layer (gutenberg_kg.serve) — one extra per module.
# NOTE: runpod is deliberately NOT listed (no `worker` extra) — its
# fastapi[all]/boto3/aiohttp[speedups] tree makes `poetry lock` pathologically
# slow, and the worker only runs in the RunPod container, which installs it
# via runpod/requirements.txt (same rationale as the mflux exclusion below).
chat = [
    "streamlit>=1.59,<2",
    "httpx>=0.27.0",
    "watchdog>=6.0.0",
    "pillow>=10.4.0",
]
# NOTE: mflux is deliberately NOT listed — its transformers pin conflicts with
# pycode-kg, so local FLUX generation uses the isolated .venv-image built from
# docker/requirements-image.txt (see `make image-server`).
image = [
    "fastapi>=0.116.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pillow>=10.4.0",
]
# NOTE: there are deliberately no `full` / `all` aggregate extras. Re-listing a
# package in an aggregate makes it a *second* declaration under different
# markers, which poetry reports as "Duplicate dependencies ... Different
# requirements found" and handles by discarding the whole resolution, adding an
# override, and starting over. Twelve packages triggered that here; the
# overrides accumulate, so `poetry lock` took 1,278 restarts and 503s. Removing
# the two aggregates took the same lock to 11s.
# The obvious alternative — `full = ["gutenberg-kg[kgdeps,viz,viz3d,mcp]"]` —
# poetry rejects outright ("Package ... is listed as a dependency of itself").
# Use `--all-extras`, or name the extras you want.

# Dev tooling. A group rather than an extra so pytest/ruff/ty/pre-commit stay
# out of the published wheel metadata — `pip install gutenberg-kg[dev]` was
# never meant to be a thing consumers do. Optional to preserve the contract
# that a bare `poetry install` is core runtime only. Same shape as pycode_kg;
# fleet convention is recorded in kgrag_priv/docs/FLEET_STANDARDS.md.
#
#   poetry install --with dev
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pdoc = ">=14.0.0"
pillow = ">=10.4.0"
pre-commit = ">=4.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"
scipy = ">=1.13.0"
ty = ">=0.0.41"
vtracer = ">=0.6.0"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/gutenberg_kg"
Repository = "https://github.com/Flux-Frontiers/gutenberg_kg"

[project.scripts]
gutenkg              = "gutenberg_kg.cli.main:cli"
gutenkg-mcp          = "gutenberg_kg.mcp_server:main"
gutenkg-handler      = "gutenberg_kg.serve.handler:main"
gutenkg-image-server = "gutenberg_kg.serve.image_server:main"
gutenkg-sdxl-server  = "gutenberg_kg.serve.sdxl_server:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour
# (0.15 gates it behind preview), so `ruff format --check .` starts rewriting
# prose docs the moment the lock resolves 0.16 — a failure that looks unrelated
# to whatever change triggered the relock. Doc snippets are illustrative and
# often deliberately aligned, so keep them out of the formatter's reach.
# doc_kg and ftree_kg carry the same exclusion.
exclude        = [".claude", "*.md"]

[tool.ruff.lint]
# BLE = flake8-blind-except (replaces pylint broad-exception-caught);
# B023 = bugbear function-uses-loop-variable (replaces pylint cell-var-from-loop).
# pyflakes F821 already covers pylint undefined-variable.
select = ["E", "F", "W", "I", "UP", "BLE", "B023"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
unresolved-import = "ignore"
# The `# ty: ignore[...]` comments on pyvista calls in scene.py and
# cli/cmd_quilt.py look unused to every CI job, because pyvista lives in the
# `viz3d` extra and all three jobs install only `dev`. Without it ty cannot
# resolve `plotter`, so it never emits the `missing-argument` /
# `invalid-argument-type` those comments suppress — but a developer running
# `--all-extras` does have pyvista, and there the suppressions do work. Deleting
# them to satisfy CI would therefore break the check locally.
#
# Silencing the rule keeps both happy. It also defuses a version trap: ty 0.0.44
# (what poetry.lock pins) reports these as warnings and exits 0, while 0.0.70
# exits 1 on the same five. The floor is `ty>=0.0.41` with no ceiling, so the
# next relock would have turned CI red on findings unrelated to whatever
# triggered it.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# PycodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src", "docker", "runpod"]

[tool.dockg]
exclude = [
    "corpus", "bundles", "dist", "src", "venv", "reports", "runpod", "docker",
]
